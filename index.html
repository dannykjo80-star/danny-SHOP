.about{max-width:1000px;margin:10px auto 0;padding:10px 20px 30px}.about h2{text-align:center}.about .lead{text-align:center;color:var(--muted);max-width:640px;margin:0 auto 22px}.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.feat{background:var(--card);border:1px solid color-mix(in srgb,var(--green) 28%,var(--line));border-radius:16px;padding:18px;box-shadow:0 8px 28px color-mix(in srgb,var(--green) 18%,transparent)}.feat i{font-style:normal;font-size:1.8rem}.feat h3{margin:6px 0 4px;font-size:1.02rem}.feat p{margin:0;color:var(--muted);font-size:.92rem}

.box{background:var(--card);width:100%;max-width:440px;max-height:92vh;overflow:auto;border-radius:18px;padding:22px}

.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}

function render(){

    return '<div class="card'+(p.out?' out':'')+(S.best===p.id?' top':'')+'"><div class="pic" data-i="'+i+'">'+(p.img?'<img src="'+esc(p.img)+'" alt="">':esc(p.e))+(p.out?'<div class="xmark"><b>✕</b><span>'+t.sold+'</span><small>'+t.soon+'</small></div>':'')+(S.best===p.id&&!p.out?'<div class="best">🔥 '+t.best+'</div>':'')+(imgs(p).length>1?'<span class="pcount">🖼 '+imgs(p).length+'</span>':'')+'</div><div class="info"><h3 class="dopen" data-i="'+i+'">'+esc(p.n[lang]||p.n.en)+'</h3>'+(dtxt(p)?'<p class="desc">'+esc(dtxt(p))+'</p><button class="more dopen" data-i="'+i+'">'+t.more+'</button>':'')+'<div class="price">'+fmt(p.price)+'</div><div class="btns"><button class="add"'+(p.out?' disabled':'')+' data-a="'+esc(p.id)+'" aria-label="+">+🛒</button><button class="buy"'+(p.out?' disabled':'')+' data-i="'+i+'">'+t.buy+'</button></div></div></div>';

$("langs").onclick=function(e){var b=e.target.closest("button");if(!b)return;lang=b.dataset.l;try{localStorage.setItem("lang",lang)}catch(x){}render()};

var CART={};
function cartItems(){var a=[];for(var id in CART){var p=S.products.filter(function(x){return x.id===id})[0];if(p&&!p.out&&CART[id]>0)a.push({p:p,q:CART[id]})}return a}

$("submit").onclick=function(){
  var f=["phone","name","province","city","address"],v={};
  for(var i=0;i<f.length;i++){v[f[i]]=$(f[i]).value.trim();if(!v[f[i]]){$("err").textContent=T[lang].req;return}}
  var t=T[lang],items=pid===null?cartItems():[{p:S.products[pid],q:1}],tot=sumItems(items),list=items.map(function(x){return "- "+(x.p.n[lang]||x.p.n.en)+" ×"+x.q+" ("+fmt(x.p.price*x.q)+")"}).join(String.fromCharCode(10));
  var text=t.msg+":"+String.fromCharCode(10)+list+String.fromCharCode(10)+t.total+": "+fmt(tot)+"\n"+t.name+": "+v.name+"\n"+t.phone+": "+v.phone+"\n"+t.province+": "+v.province+"\n"+t.city+": "+v.city+"\n"+t.address+": "+v.address;
  text+=String.fromCharCode(10)+t.payLine+": "+(PAY==="dep"?t.depTxt+" "+fmt(dep()):t.codTxt);
  if(PAY==="dep"){PEND=text;showPay();return}
  window.open("https://wa.me/"+SHOP_PHONE+"?text="+encodeURIComponent(text),"_blank");
  f.forEach(function(k){$(k).value=""});if(pid===null){CART={};cartRender()}closeM("m-order");
};

function imgs(p){var a=[];if(p.img)a.push(p.img);(p.imgs||[]).forEach(function(u){if(u)a.push(u)});return a}
function dtxt(p){return (p.d&&(p.d[lang]||p.d.en))||""}
var DI=null,GI=0,tx0=null;
function openDetail(i){DI=i;GI=0;detRender();openM("m-detail")}
function detRender(){
  var p=S.products[DI];if(!p)return;var t=T[lang],im=imgs(p);if(GI>=im.length)GI=0;
  $("gal").innerHTML=(im.length?'<img src="'+esc(im[GI])+'" alt="">':esc(p.e))+(im.length>1?'<button class="gnav l" data-g="-1" aria-label="prev">‹</button><button class="gnav r" data-g="1" aria-label="next">›</button><span class="gcount">'+(GI+1)+'/'+im.length+'</span>':'');
  $("thumbs").innerHTML=im.length>1?im.map(function(u,k){return '<button data-k="'+k+'"'+(k===GI?' class="on"':'')+'><img src="'+esc(u)+'" alt=""></button>'}).join(""):"";
  $("dname").textContent=p.n[lang]||p.n.en;$("dprice").textContent=fmt(p.price);

$("gal").onclick=function(e){var b=e.target.closest(".gnav");if(!b)return;var n=imgs(S.products[DI]).length;GI=(GI+(+b.dataset.g)+n)%n;detRender()};
$("thumbs").onclick=function(e){var b=e.target.closest("button");if(!b)return;GI=+b.dataset.k;detRender()};
$("gal").addEventListener("touchstart",function(e){tx0=e.touches[0].clientX},{passive:true});
$("gal").addEventListener("touchend",function(e){if(tx0===null)return;var dx=e.changedTouches[0].clientX-tx0;tx0=null;var n=imgs(S.products[DI]).length;if(n>1&&Math.abs(dx)>40){GI=(GI+(dx<0?1:-1)+n)%n;detRender()}},{passive:true});
$("dadd").onclick=function(){var p=S.products[DI];if(!p||p.out)return;CART[p.id]=(CART[p.id]||0)+1;cartRender();var b=$("dadd");b.textContent="✓";setTimeout(function(){b.textContent="+🛒"},700)};
$("dbuy").onclick=function(){if(!S.products[DI]||S.products[DI].out)return;pid=DI;$("err").textContent="";closeM("m-detail");render();openM("m-order")};

var PAY="cod",PEND="",SLIP=null;
function dep(){return S.deposit||10000}
function payUI(){var t=T[lang];$("submit").textContent=PAY==="dep"?t.payBtn:t.submit;$("deplbl").textContent=t.dep+" ("+fmt(dep())+")";$("ordnote").textContent=PAY==="dep"?t.noteDep:t.noteCod}
document.querySelectorAll('input[name="pay"]').forEach(function(r){r.onchange=function(){PAY=r.value;payUI()}});
function showPay(){var t=T[lang];$("payamt").textContent=t.amtL+": "+fmt(dep());$("qrbox").innerHTML=S.qr?'<img src="'+esc(S.qr)+'" alt="QR" style="width:100%;max-width:300px;border-radius:12px;display:block;margin:auto">':'<p style="color:#d33;text-align:center">'+t.noQr+'</p>';closeM("m-order");openM("m-pay")}
$("paid").onclick=function(){$("serr").textContent="";closeM("m-pay");openM("m-slip")};
$("slipf").onchange=function(){SLIP=this.files[0]||null;var im=$("slipimg");if(SLIP){im.src=URL.createObjectURL(SLIP);im.style.display="block"}else im.style.display="none"};
function finish(){["phone","name","province","city","address"].forEach(function(k){$(k).value=""});if(pid===null){CART={};cartRender()}closeM("m-slip");SLIP=null;$("slipf").value="";$("slipimg").style.display="none"}
$("slipwa").onclick=function(){var t=T[lang];if(!SLIP){$("serr").textContent=t.needSlip;return}window.open("https://wa.me/"+SHOP_PHONE+"?text="+encodeURIComponent(PEND+String.fromCharCode(10)+t.slipNote),"_blank");finish()};
$("slipshare").onclick=async function(){var t=T[lang];if(!SLIP){$("serr").textContent=t.needSlip;return}try{if(navigator.canShare&&navigator.canShare({files:[SLIP]})){await navigator.share({files:[SLIP],text:PEND});finish()}else $("serr").textContent=t.noShare}catch(e){}};

/* ---------- admin ---------- */
function buildHTML(st){
  var json=JSON.stringify(st).replace(/</g,"\\u003c");
  return SRC.replace(/(<script type="application\/json" id="state">)[\s\S]*?(<\/script>)/,function(m,a,b){return a+json+b});
}
async function sha(s){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
async function save(st,eid){
  $(eid).textContent="";
  try{
    if(typeof claude==="undefined")throw 0;
    var a=await claude.use("artifact");if(!a)throw 0;
    await a.publish(buildHTML(st));
  }catch(e){$(eid).textContent=T[lang].noperm}
}
$("adminBtn").onclick=function(){$("lerr").textContent="";$("lem").value="";$("lpw").value="";$("ltitle").textContent=S.admin?T[lang].login:T[lang].setup;openM("m-login")};
$("lgo").onclick=async function(){
  var e=$("lem").value.trim().toLowerCase(),pw=$("lpw").value;
  if(!e||!pw){$("lerr").textContent=T[lang].req;return}
  var h=await sha(e+":"+pw);
  if(!S.admin){var n=clone(S);n.admin={email:e,hash:h};await save(n,"lerr");return}
  if(S.admin.email===e&&S.admin.hash===h){closeM("m-login");W=clone(S);adminRender();$("aerr").textContent="";openM("m-admin")}
  else $("lerr").textContent=T[lang].wrong;
};
function inp(val,cb,type,ph){var i=document.createElement("input");i.type=type||"text";i.value=val;if(ph)i.placeholder=ph;i.oninput=function(){cb(type==="number"?(+i.value||0):i.value)};return i}
function fld(label,el){var d=document.createElement("div");var l=document.createElement("label");l.textContent=label;d.appendChild(l);d.appendChild(el);return d}
function adminRender(){
  var t=T[lang],b=$("abody");b.innerHTML="";
  var top=document.createElement("div");top.className="two";
  top.appendChild(fld(t.shopName,inp(W.name,function(v){W.name=v})));
  top.appendChild(fld(t.color,inp(W.color,function(v){W.color=v},"color")));
  b.appendChild(top);
  function media(label,key,round){
    var w=document.createElement("div");w.className="prow";
    var th=document.createElement("div");th.className="thumb";if(round)th.style.borderRadius="50%";th.innerHTML=W[key]?'<img src="'+esc(W[key])+'" alt="">':"🖼️";w.appendChild(th);
    var f=document.createElement("div");f.className="f";var l=document.createElement("label");l.textContent=label;f.appendChild(l);
    var acts=document.createElement("div");acts.className="acts";
    var up=document.createElement("label");up.className="btn";up.textContent=t.img;
    var fi=document.createElement("input");fi.type="file";fi.accept="image/*";fi.style.display="none";
    fi.onchange=async function(){if(!fi.files[0])return;try{var as=await claude.use("assets");if(!as)throw 0;var r=await as.upload(fi.files[0]);W[key]=r.url;adminRender()}catch(e){$("aerr").textContent=t.noperm}};
    up.appendChild(fi);acts.appendChild(up);
    var d=document.createElement("button");d.className="danger";d.textContent=t.del;d.onclick=function(){W[key]="";adminRender()};
    acts.appendChild(d);f.appendChild(acts);w.appendChild(f);b.appendChild(w);
  }
  media(t.logoL,"logo",true);media(t.bgL,"bg",false);media(t.qrL,"qr",false);b.appendChild(fld(t.depAdm,inp(W.deposit||10000,function(v){W.deposit=v||10000},"number")));
  var rl=document.createElement("label");rl.textContent=t.rates;b.appendChild(rl);
  var rt=document.createElement("div");rt.className="two";
  rt.appendChild(fld("THB",inp(W.rates.THB,function(v){W.rates.THB=v||1},"number")));
  rt.appendChild(fld("USD",inp(W.rates.USD,function(v){W.rates.USD=v||1},"number")));
  b.appendChild(rt);
  W.products.forEach(function(p,i){
    var row=document.createElement("div");row.className="prow";
    var th=document.createElement("div");th.className="thumb";th.innerHTML=p.img?'<img src="'+esc(p.img)+'" alt="">':esc(p.e);row.appendChild(th);
    var f=document.createElement("div");f.className="f";
    f.appendChild(inp(p.n.lo,function(v){p.n.lo=v},"text","ລາວ"));
    f.appendChild(inp(p.n.th,function(v){p.n.th=v},"text","ไทย"));
    f.appendChild(inp(p.n.en,function(v){p.n.en=v},"text","English"));
    f.appendChild(fld(t.priceLak,inp(p.price,function(v){p.price=v},"number")));
    var sr=document.createElement("label");sr.className="soldrow";var ck=document.createElement("input");ck.type="checkbox";ck.checked=!!p.out;ck.onchange=function(){p.out=ck.checked};sr.appendChild(ck);sr.appendChild(document.createTextNode(t.soldL));f.appendChild(sr);
    var br=document.createElement("label");br.className="soldrow";var bk=document.createElement("input");bk.type="checkbox";bk.checked=W.best===p.id;bk.onchange=function(){W.best=bk.checked?p.id:"";adminRender()};br.appendChild(bk);br.appendChild(document.createTextNode("🔥 "+t.bestL));f.appendChild(br);
    if(!p.d)p.d={lo:"",th:"",en:""};
    var dl=document.createElement("label");dl.textContent=t.descL;f.appendChild(dl);
    ["lo","th","en"].forEach(function(k){var ta=document.createElement("textarea");ta.rows=2;ta.value=p.d[k]||"";ta.placeholder=t.descL+" ("+k.toUpperCase()+")";ta.oninput=function(){p.d[k]=ta.value};f.appendChild(ta)});
    var fin=document.createElement("div");fin.className="two";
    fin.appendChild(fld(t.costL,inp(p.cost||0,function(v){p.cost=v;profitRender()},"number")));
    fin.appendChild(fld(t.soldN,inp(p.sold||0,function(v){p.sold=v;profitRender()},"number")));
    f.appendChild(fin);
    var pl=document.createElement("div");pl.className="profit";pl.id="pf-"+i;f.appendChild(pl);
    var gl=document.createElement("label");gl.textContent=t.galL;f.appendChild(gl);
    var gx=document.createElement("div");gx.className="gx";
    imgs(p).forEach(function(u,k){
      var c=document.createElement("div");c.className="gi";var im=document.createElement("img");im.src=u;im.alt="";c.appendChild(im);
      if(k===0){var m=document.createElement("span");m.className="gm";m.textContent="★";c.appendChild(m)}
      var x=document.createElement("button");x.className="gdel";x.textContent="×";x.setAttribute("aria-label","delete");
      x.onclick=function(){var l2=imgs(p);l2.splice(k,1);p.img=l2[0]||"";p.imgs=l2.slice(1);adminRender()};
      c.appendChild(x);gx.appendChild(c)});
    f.appendChild(gx);
    var acts=document.createElement("div");acts.className="acts";
    var up=document.createElement("label");up.className="btn";up.textContent=t.addImgs;
    var fi=document.createElement("input");fi.type="file";fi.accept="image/*";fi.multiple=true;fi.style.display="none";
    fi.onchange=async function(){
      var fs=Array.prototype.slice.call(fi.files||[]);if(!fs.length)return;
      try{var as=await claude.use("assets");if(!as)throw 0;var l3=imgs(p);for(var q=0;q<fs.length;q++){var r=await as.upload(fs[q]);l3.push(r.url)}p.img=l3[0]||"";p.imgs=l3.slice(1);adminRender()}catch(e){$("aerr").textContent=t.noperm}
    };
    up.appendChild(fi);acts.appendChild(up);
    var d=document.createElement("button");d.className="danger";d.textContent=t.del;d.onclick=function(){W.products.splice(i,1);adminRender()};
    acts.appendChild(d);f.appendChild(acts);row.appendChild(f);b.appendChild(row);
  });
  var ps=document.createElement("div");ps.id="psum";b.appendChild(ps);profitRender();
}
function money(n){return Math.round(n).toLocaleString("en-US")+" ₭"}
function profitRender(){
  var t=T[lang],R=0,C=0;
  W.products.forEach(function(p,i){
    var q=p.sold||0,c=p.cost||0,rev=p.price*q,cs=c*q,pr=rev-cs,unit=p.price-c,mg=p.price?Math.round(unit/p.price*1000)/10:0;
    R+=rev;C+=cs;
    var el=$("pf-"+i);if(el){el.className="profit"+(pr<0?" neg":"");el.textContent=t.unitP+": "+money(unit)+" ("+mg+"%) · "+t.revL+": "+money(rev)+" · "+t.profL+": "+money(pr)}
  });
  var P=R-C,sm=$("psum");if(!sm)return;
  sm.className="psum"+(P<0?" neg":"");
  sm.innerHTML='<h4>📊 '+t.sumT+'</h4><div><span>'+t.revTot+'</span><b>'+money(R)+'</b></div><div><span>'+t.costTot+'</span><b>'+money(C)+'</b></div><div class="tot"><span>'+t.profTot+'</span><b>'+money(P)+'</b></div>';
}
$("aadd").onclick=function(){W.products.push({id:"p"+Date.now(),e:"🛍️",img:"",price:0,n:{lo:"",th:"",en:""}});adminRender()};
$("asave").onclick=function(){save(W,"aerr")};
render();
